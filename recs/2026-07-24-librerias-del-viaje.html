<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../icon-192.png">
<title>🗺️ Librerías del viaje · Bibliotequeando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D12;
  --papel:#F4F1EA;
  --bruma:#9AA3B2;
  --linea:rgba(244,241,234,.16);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* acento: lo pisa cada ciudad */
  --ac:#E8A33D;
  --ac2:#F3C572;
  --c1:#1B2436;
  --c2:#0B0D12;
  /* tipografía escalada a la pantalla: en TV manda vmin */
  --u: clamp(14px, 2.1vmin, 34px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--papel);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;
  font-size:calc(var(--u)*1.15);
}
::selection{background:var(--ac);color:#0B0D12}
button{font-family:var(--sans);cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ac2);outline-offset:4px;border-radius:8px}

/* ---------- escenario ---------- */
#deck{position:fixed;inset:0}
.slide{
  position:absolute;inset:0;
  /* flex-start + margin auto en el hijo: centra cuando entra, y no recorta arriba cuando no entra */
  display:flex;flex-direction:column;justify-content:flex-start;
  /* safe area: los televisores recortan los bordes (overscan) */
  padding:6vmin max(7vmin,env(safe-area-inset-left)) 11vmin max(7vmin,env(safe-area-inset-right));
  opacity:0;visibility:hidden;transform:scale(1.03);
  /* visibility conmuta recién al terminar el fundido al ocultar, y al instante al mostrar */
  transition:opacity .55s ease,transform .55s ease,visibility 0s linear .55s;
  background:radial-gradient(120% 90% at 50% 0%,var(--c1) 0%,var(--c2) 70%);
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.slide.on{opacity:1;visibility:visible;transform:none;z-index:2;
  transition:opacity .55s ease,transform .55s ease,visibility 0s linear 0s}
.slide .lienzo{position:absolute;inset:0;pointer-events:none;opacity:.32}
.slide .lienzo svg{position:absolute;bottom:0;left:0;width:100%;height:auto;max-height:34vh;display:block;
  /* se funde con el fondo en vez de cortar en un bloque duro */
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%)}
.slide .grano{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
.int{position:relative;z-index:3;max-width:min(112rem,88vw);margin-block:auto}

/* ---------- barra de progreso tipo historias ---------- */
#barras{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:.5vmin;
  padding:2.2vmin max(7vmin,env(safe-area-inset-left)) 0;pointer-events:none}
/* min-width:0 es lo que permite que la etiqueta larga se recorte en vez de pisar a la vecina */
#barras .grupo{flex:1;min-width:0;display:flex;flex-direction:column;gap:.7vmin}
#barras .riel{height:.55vmin;border-radius:99px;background:rgba(244,241,234,.2);overflow:hidden;display:flex;gap:.35vmin}
#barras .seg{flex:1;background:rgba(244,241,234,.14);border-radius:99px;transition:background .3s ease}
#barras .seg.v{background:var(--papel)}
#barras .et{font-size:calc(var(--u)*.72);letter-spacing:.16em;text-transform:uppercase;
  color:var(--bruma);font-weight:700;text-align:center;transition:color .3s ease;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barras .grupo.act .et{color:var(--ac2)}

/* ---------- portada ---------- */
.portada .kicker{font-size:calc(var(--u)*.85);letter-spacing:.3em;text-transform:uppercase;
  color:var(--ac);font-weight:700;margin-bottom:3vmin}
.portada h1{font-family:var(--serif);font-weight:800;font-size:calc(var(--u)*5.2);
  line-height:.98;letter-spacing:-.02em;margin-bottom:3vmin}
.portada h1 em{font-style:italic;color:var(--ac2);display:block}
.portada .sub{color:var(--bruma);font-size:calc(var(--u)*1.25);max-width:42ch;margin-bottom:5vmin}
.ruta{display:flex;flex-wrap:wrap;gap:1.2vmin}
.ruta span{border:1px solid var(--linea);border-radius:99px;padding:.9vmin 2.2vmin;
  font-size:calc(var(--u)*.92);font-weight:600;color:var(--papel);background:rgba(244,241,234,.05)}
.ruta span b{color:var(--ac2);font-weight:700}

/* ---------- portadilla de ciudad ---------- */
.ciudad .num{font-family:var(--serif);font-size:calc(var(--u)*2);color:var(--ac);
  font-weight:700;letter-spacing:.2em;margin-bottom:2vmin}
.ciudad h2{font-family:var(--serif);font-weight:800;font-size:calc(var(--u)*6.4);
  line-height:.94;letter-spacing:-.025em;margin-bottom:2.5vmin}
.ciudad .pais{font-size:calc(var(--u)*1.1);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ac2);font-weight:700;margin-bottom:3vmin}
.ciudad .linea{color:var(--bruma);font-size:calc(var(--u)*1.3);max-width:40ch;font-family:var(--serif);font-style:italic}

/* ---------- ficha de parada ---------- */
/* En pantalla apaisada (TV) va a dos columnas: el 16:9 sobra de ancho y falta de alto. */
.parada .int{display:grid;grid-template-columns:1fr;gap:3vmin;align-items:start}
.parada .top{display:flex;align-items:baseline;gap:2.5vmin;margin-bottom:1.8vmin;flex-wrap:wrap}
.parada .rank{font-family:var(--serif);font-weight:800;font-size:calc(var(--u)*3.2);
  color:var(--ac);line-height:1}
.parada .donde{font-size:calc(var(--u)*.85);letter-spacing:.24em;text-transform:uppercase;
  color:var(--bruma);font-weight:700}
.parada h3{font-family:var(--serif);font-weight:800;font-size:calc(var(--u)*3);
  line-height:1.03;letter-spacing:-.02em;margin-bottom:1.4vmin;max-width:18ch}
.parada .tipo{display:inline-block;font-size:calc(var(--u)*.78);letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;color:#0B0D12;background:var(--ac2);
  border-radius:99px;padding:.65vmin 1.7vmin;margin-bottom:2.4vmin}
.parada .porque{font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*1.45);
  line-height:1.32;max-width:24ch;color:var(--papel)}
.parada .porque b{font-style:normal;font-weight:700;color:var(--ac2)}
.datos{display:grid;gap:1.1vmin;margin-bottom:2.4vmin}
.datos div{border:1px solid var(--linea);border-radius:1.2vmin;padding:1.1vmin 1.8vmin;
  background:rgba(244,241,234,.05);min-width:0}
.datos dt{font-size:calc(var(--u)*.68);letter-spacing:.18em;text-transform:uppercase;
  color:var(--ac);font-weight:700;margin-bottom:.25vmin}
.datos dd{font-size:calc(var(--u)*.92);color:var(--papel);font-weight:600;line-height:1.4}
.ojo{display:flex;gap:1.2vmin;align-items:flex-start;border-left:.35vmin solid var(--ac);
  padding-left:1.8vmin;color:var(--bruma);font-size:calc(var(--u)*.88);line-height:1.45;margin-bottom:2.4vmin}
.ojo b{color:var(--ac2)}

/* marcador "quiero ir" — en el flujo, nada lo puede tapar */
.marcar{display:flex;align-items:center;gap:1.4vmin}
.marcar button{border:.28vmin solid var(--linea);background:rgba(11,13,18,.5);
  border-radius:99px;padding:1.3vmin 2.6vmin;font-size:calc(var(--u)*1);font-weight:700;
  display:flex;align-items:center;gap:1.1vmin;transition:all .25s ease;backdrop-filter:blur(6px)}
.marcar button:hover{border-color:var(--ac);color:var(--ac2)}
.marcar button.si{background:var(--ac);border-color:var(--ac);color:#0B0D12}
.marcar .tecla{font-size:calc(var(--u)*.7);color:var(--bruma);letter-spacing:.1em}

@media (min-width:900px){
  .parada .int{grid-template-columns:1.08fr .92fr;gap:6vmin;max-width:min(150rem,90vw)}
  .parada h3{font-size:calc(var(--u)*3.2)}
  .parada .porque{font-size:calc(var(--u)*1.5)}
}

/* ---------- cierre ---------- */
.cierre h2{font-family:var(--serif);font-weight:800;font-size:calc(var(--u)*3.6);
  line-height:1;margin-bottom:2.5vmin}
.cierre .sub{color:var(--bruma);font-size:calc(var(--u)*1.1);max-width:46ch;margin-bottom:3vmin}
#listaSel{display:flex;flex-wrap:wrap;gap:1.2vmin;margin-bottom:3.5vmin;max-width:80vw}
#listaSel span{border:1px solid var(--ac);color:var(--ac2);border-radius:99px;
  padding:.9vmin 2vmin;font-size:calc(var(--u)*.92);font-weight:600}
#listaSel .vacio{border-color:var(--linea);color:var(--bruma)}
.cierre .fila{display:flex;flex-wrap:wrap;gap:1.4vmin;align-items:center;margin-bottom:2.5vmin}
.cierre .fila button{border:1px solid var(--linea);background:rgba(244,241,234,.05);
  border-radius:99px;padding:1.2vmin 2.4vmin;font-size:calc(var(--u)*1);font-weight:600;transition:all .25s ease}
.cierre .fila button:hover{border-color:var(--ac);color:var(--ac2)}
.cierre .rot{font-size:calc(var(--u)*.8);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ac);font-weight:700;margin-bottom:1.2vmin}
.q-hint,.react-hint{display:inline-block;margin-left:1.4vmin;font-size:calc(var(--u)*.9);color:var(--ac2)}
#nota{width:min(58rem,78vw);box-sizing:border-box;resize:none;padding:1.4vmin 1.8vmin;
  border-radius:1.4vmin;border:1px solid var(--linea);background:rgba(244,241,234,.06);
  color:inherit;font-family:inherit;font-size:calc(var(--u)*1);margin-bottom:1.4vmin}
.cierre a.hub{color:var(--ac2);text-decoration:none;font-weight:700;border-bottom:2px solid var(--ac);
  padding-bottom:.3vmin;font-size:calc(var(--u)*1)}

/* ---------- controles ---------- */
/* "Volver" vive en el pie: arriba pisaba la última etiqueta de la barra de progreso */
.back{color:var(--bruma);text-decoration:none;font-size:calc(var(--u)*.8);
  padding:.8vmin 1.8vmin;border:1px solid var(--linea);border-radius:99px;
  background:rgba(11,13,18,.6);backdrop-filter:blur(6px);font-weight:600;
  white-space:nowrap;pointer-events:auto}
.back:hover{color:var(--ac2);border-color:var(--ac)}
#pie{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;
  justify-content:space-between;gap:2vmin;
  padding:0 max(7vmin,env(safe-area-inset-right)) 3.2vmin max(7vmin,env(safe-area-inset-left));
  pointer-events:none}
#pie .izq{display:flex;align-items:center;gap:2vmin;min-width:0}
#pie .ayuda{font-size:calc(var(--u)*.78);color:var(--bruma);letter-spacing:.06em}
/* el banner de engage.js se inyecta suelto en el body: acá le damos un lugar fijo */
#engage-unsub{position:fixed!important;left:50%;transform:translateX(-50%);
  bottom:.4vmin;margin:0!important;z-index:41;opacity:.4!important;font-size:calc(var(--u)*.68)!important}
#pie .ayuda kbd{background:rgba(244,241,234,.12);border:1px solid var(--linea);
  border-radius:.6vmin;padding:.25vmin .9vmin;font-family:var(--sans);font-size:calc(var(--u)*.74);font-weight:700}
#pie .mandos{display:flex;gap:1.2vmin;pointer-events:auto}
#pie .mandos button{border:1px solid var(--linea);background:rgba(11,13,18,.6);
  border-radius:99px;width:6.4vmin;height:6.4vmin;min-width:44px;min-height:44px;
  font-size:calc(var(--u)*1.1);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);transition:all .25s ease}
#pie .mandos button:hover{border-color:var(--ac);color:var(--ac2)}

@media (max-width:760px){
  :root{--u:clamp(12px,3.1vmin,20px)}
  .slide{padding:11vmin 7vw 16vmin}
  .parada h3{font-size:calc(var(--u)*2.5)}
  .parada .porque{font-size:calc(var(--u)*1.35)}
  .ciudad h2{font-size:calc(var(--u)*4.2)}
  .portada h1{font-size:calc(var(--u)*3.6)}
  .marcar{align-items:flex-start;margin-top:1vmin}
  #pie .ayuda{display:none}
  #barras .et{font-size:calc(var(--u)*.6)}
}
/* apaisado bajito (teléfono de costado): dos columnas para no apilar tanto */
@media (min-width:800px) and (max-height:560px){
  .parada .int{grid-template-columns:1.08fr .92fr;gap:4vmin}
  .slide{padding:8vmin 6vmin 12vmin}
}
@media (prefers-reduced-motion:reduce){
  .slide{transition:opacity .01s linear}
  *,*::before,*::after{animation:none!important}
}
</style>
</head>
<body>

<div id="barras" aria-hidden="true"></div>
<div id="deck"></div>

<div id="pie">
  <div class="izq">
    <a class="back" href="../index.html">← Bibliotequeando</a>
    <p class="ayuda"><kbd>←</kbd> <kbd>→</kbd> para moverte · <kbd>Enter</kbd> marca "quiero ir" · <kbd>P</kbd> modo TV</p>
  </div>
  <div class="mandos">
    <button id="bPrev" aria-label="Anterior" title="Anterior">‹</button>
    <button id="bPlay" aria-label="Modo TV: avance automático" title="Modo TV">▶</button>
    <button id="bNext" aria-label="Siguiente" title="Siguiente">›</button>
  </div>
</div>

/* ============================================================ */
var deck=document.getElementById('deck');
var barras=document.getElementById('barras');
var slides=[],meta=[];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
/* el texto de los datos es nuestro y controlado: permite <b> a propósito */
function tema(c){return 'style="--ac:'+c.ac+';--ac2:'+c.ac2+';--c1:'+c.c1+';--c2:'+c.c2+'"'}
function lienzo(c){return '<div class="lienzo" style="color:'+c.ac+'">'+(ARTE[c.arte]||'')+'</div><div class="grano"></div>'}

function armar(){
  var html='';
  /* portada */
  html+='<section class="slide portada" '+tema(CIUDADES[0])+'>'+lienzo(CIUDADES[0])+
    '<div class="int"><p class="kicker">Bibliotequeando · edición de viaje</p>'+
    '<h1>Librerías<em>del viaje</em></h1>'+
    '<p class="sub">Las 3 paradas que sí valen en cada ciudad. Elegidas por historia, rareza o belleza — no por estar cerca del hotel.</p>'+
    '<div class="ruta"><span><b>6</b> ciudades</span><span><b>18</b> paradas</span><span><b>3</b> países</span></div></div></section>';
  meta.push({tipo:'portada',ciudad:-1});

  CIUDADES.forEach(function(c,ci){
    html+='<section class="slide ciudad" '+tema(c)+'>'+lienzo(c)+
      '<div class="int"><p class="num">CIUDAD '+(ci+1)+' DE 6</p>'+
      '<h2>'+esc(c.nombre)+'</h2><p class="pais">'+esc(c.pais)+'</p>'+
      '<p class="linea">'+esc(c.lema)+'</p></div></section>';
    meta.push({tipo:'ciudad',ciudad:ci});

    c.paradas.forEach(function(p,pi){
      var id=c.id+'-'+(pi+1);
      var datos=p.datos.map(function(d){
        return '<div><dt>'+esc(d[0])+'</dt><dd>'+d[1]+'</dd></div>';
      }).join('');
      html+='<section class="slide parada" '+tema(c)+'>'+lienzo(c)+
        '<div class="int">'+
        '<div class="col-a">'+
          '<div class="top"><span class="rank">0'+(pi+1)+'</span><span class="donde">'+esc(c.nombre)+' · '+esc(c.pais)+'</span></div>'+
          '<h3>'+esc(p.n)+'</h3>'+
          '<span class="tipo">'+esc(p.tipo)+'</span>'+
          '<p class="porque">'+p.porque+'</p>'+
        '</div>'+
        '<div class="col-b">'+
          '<dl class="datos">'+datos+'</dl>'+
          '<p class="ojo"><span aria-hidden="true">👁️</span><span>'+p.ojo+'</span></p>'+
          '<div class="marcar"><button type="button" data-ir="'+id+'" data-nombre="'+esc(p.n)+'" data-ciudad="'+esc(c.nombre)+'">'+
          '<span class="ic">☆</span><span class="tx">Quiero ir</span></button>'+
          '<span class="tecla">Enter</span></div>'+
        '</div>'+
        '</div>'+
        '</section>';
      meta.push({tipo:'parada',ciudad:ci,id:id});
    });
  });

  /* cierre: vuelve a la paleta de la casa, no a la de una ciudad */
  var c0={ac:'#E8A33D',ac2:'#F3C572',c1:'#1B2436',c2:'#0B0D12',arte:'canal'};
  html+='<section class="slide cierre" '+tema(c0)+'>'+lienzo(c0)+
    '<div class="int">'+
    '<p class="rot">Tu lista</p>'+
    '<h2>Las que marcaste</h2>'+
    '<div id="listaSel"><span class="vacio">Todavía no marcaste ninguna — volvé con ← y tocá "Quiero ir".</span></div>'+
    '<p class="rot">¿Sirvió esta guía?</p>'+
    '<div class="fila">'+
      '<button onclick="engageReact(\''+REC+'\',\'love\',this)">😍</button>'+
      '<button onclick="engageReact(\''+REC+'\',\'like\',this)">🙂</button>'+
      '<button onclick="engageReact(\''+REC+'\',\'meh\',this)">😐</button>'+
      '<button onclick="engageReact(\''+REC+'\',\'no\',this)">🙅</button>'+
      '<span class="react-hint"></span>'+
    '</div>'+
    '<p class="rot">¿Falta alguna ciudad o querés otra vuelta?</p>'+
    '<textarea id="nota" rows="2" placeholder="Escribime acá: otra ciudad, otro tipo de librería, lo que sea."></textarea>'+
    '<div class="fila"><button type="button" onclick="enviarNota(this)">Enviarme esto</button><span class="q-hint"></span></div>'+
    '<p style="margin-top:1.5vmin"><a class="hub" href="./">📚 Ver todas las sugerencias →</a></p>'+
    '</div></section>';
  meta.push({tipo:'cierre',ciudad:-1});

  deck.innerHTML=html;
  slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));

  /* barra de progreso: un grupo por ciudad */
  var bh='';
  CIUDADES.forEach(function(c){
    bh+='<div class="grupo" data-c="'+c.id+'"><div class="riel">'+
      '<i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i>'+
      '</div><span class="et">'+esc(c.nombre)+'</span></div>';
  });
  barras.innerHTML=bh;
}

/* ---------- navegación ---------- */
var i=0,auto=null;
function ir(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  if(n===i&&slides[i].classList.contains('on'))return;
  slides.forEach(function(s){s.classList.remove('on')});
  slides[n].classList.add('on');
  i=n;
  pintarBarras();
  if(meta[i].tipo==='cierre')pintarLista();
  /* replaceState y no location.hash: no ensucia el historial ni rompe el botón "atrás" del control */
  try{history.replaceState(null,'','#p'+i)}catch(e){}
}
function pintarBarras(){
  var ci=meta[i].ciudad;
  var grupos=barras.querySelectorAll('.grupo');
  Array.prototype.forEach.call(grupos,function(g,gi){
    g.classList.toggle('act',gi===ci);
    var segs=g.querySelectorAll('.seg');
    /* índice de la diapositiva dentro de la ciudad: 0=portadilla, 1..3=paradas */
    var base=1+gi*4;
    Array.prototype.forEach.call(segs,function(s,si){
      var idx=base+si;
      s.classList.toggle('v', i>=idx || (ci>gi) || (meta[i].tipo==='cierre'));
    });
  });
}
function next(){ir(i+1)}
function prev(){ir(i-1)}

/* ---------- "quiero ir" ---------- */
var SEL={};
try{SEL=JSON.parse(localStorage.getItem('viaje-librerias')||'{}')||{}}catch(e){SEL={}}
function pintarBotones(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-ir]'),function(b){
    var on=!!SEL[b.getAttribute('data-ir')];
    b.classList.toggle('si',on);
    b.querySelector('.ic').textContent=on?'★':'☆';
    b.querySelector('.tx').textContent=on?'En la lista':'Quiero ir';
    b.setAttribute('aria-pressed',on?'true':'false');
  });
}
function alternar(b){
  var id=b.getAttribute('data-ir');
  if(SEL[id]){delete SEL[id]}
  else{SEL[id]={n:b.getAttribute('data-nombre'),c:b.getAttribute('data-ciudad')};
    if(window.engageAnswer)window.engageAnswer('viaje-libreria:'+id,'quiero_ir',b);}
  try{localStorage.setItem('viaje-librerias',JSON.stringify(SEL))}catch(e){}
  pintarBotones();
}
function pintarLista(){
  var cont=document.getElementById('listaSel');if(!cont)return;
  var ks=Object.keys(SEL);
  if(!ks.length){cont.innerHTML='<span class="vacio">Todavía no marcaste ninguna — volvé con ← y tocá "Quiero ir".</span>';return}
  cont.innerHTML=ks.map(function(k){
    return '<span>'+esc(SEL[k].n)+' <b style="opacity:.6">· '+esc(SEL[k].c)+'</b></span>';
  }).join('');
}

/* ---------- nota libre al agente ---------- */
function enviarNota(btn){
  var ta=document.getElementById('nota');
  var txt=(ta&&ta.value||'').trim();
  var hint=btn.parentElement.querySelector('.q-hint');
  if(!txt){if(hint)hint.textContent='Escribí algo primero ✍️';return}
  if(window.engageAnswer)window.engageAnswer('rec-nota:'+REC,txt,btn);
  if(ta){ta.setAttribute('disabled','disabled');ta.style.opacity='.5'}
}

/* ---------- modo TV (avance automático) ---------- */
function playPause(){
  var b=document.getElementById('bPlay');
  if(auto){clearInterval(auto);auto=null;b.textContent='▶';b.setAttribute('aria-label','Modo TV: avance automático')}
  else{auto=setInterval(function(){ if(i>=slides.length-1){clearInterval(auto);auto=null;document.getElementById('bPlay').textContent='▶';return} next(); },11000);
    b.textContent='❚❚';b.setAttribute('aria-label','Pausar avance automático');next()}
}

/* ---------- arranque ---------- */
armar();
pintarBotones();
ir(0);

document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(tag==='TEXTAREA'||tag==='INPUT')return;              /* no robar teclas al escribir */
  var k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Spacebar'){e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='Home'){e.preventDefault();ir(0)}
  else if(k==='End'){e.preventDefault();ir(slides.length-1)}
  else if(k==='Enter'){
    var b=slides[i].querySelector('[data-ir]');
    if(b){e.preventDefault();alternar(b)}
  }
  else if(k==='p'||k==='P'){e.preventDefault();playPause()}
});

deck.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-ir]'):null;
  if(b){alternar(b)}
});
document.getElementById('bPrev').addEventListener('click',prev);
document.getElementById('bNext').addEventListener('click',next);
document.getElementById('bPlay').addEventListener('click',playPause);

/* gestos en teléfono */
var x0=null,y0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){
  if(x0===null)return;
  var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}
  x0=y0=null;
},{passive:true});
</script>
